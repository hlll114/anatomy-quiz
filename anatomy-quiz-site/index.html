<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人体解剖生理学刷题系统 · 看图识别 · 间隔重复复习</title>
<meta name="description" content="免费的人体解剖生理学在线刷题工具：内置 160 道题，覆盖细胞与组织、循环、呼吸、消化、泌尿、神经、内分泌等 10 个章节；支持单选题、判断题、填空题、名词卡、反向题和看图识别题六种题型，按间隔重复（1/3/7/15/30 天）自动安排复习，无需注册，打开即用。">
<meta name="keywords" content="人体解剖生理学,解剖学刷题,生理学题库,看图识别题,间隔重复,艾宾浩斯,期末复习,免费刷题网站">
<meta name="author" content="暨南大学 人工智能应用实践">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<!-- 社交平台分享预览 -->
<meta property="og:type" content="website">
<meta property="og:title" content="人体解剖生理学刷题系统 · 看图识别 · 间隔重复">
<meta property="og:description" content="160 道解剖生理学题目，六种题型含看图识别，按艾宾浩斯间隔重复自动排复习，打开即用。">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">解</span>
      <span class="brand-text">解剖生理学 · 刷题</span>
    </a>
    <nav class="nav">
      <a href="index.html">今日</a>
      <a href="bank.html">题库</a>
      <a href="quiz.html">刷题</a>
      <a href="stats.html">统计</a>
    </nav>
  </div>
</header>

<main class="wrap page">

  <div class="page-head">
    <h1 id="greeting">今日学习</h1>
    <p><span id="today"></span> · 按间隔重复安排，答错的题会自动回到队列</p>
  </div>

  <!-- 数据概览 -->
  <section class="stat-grid">
    <div class="stat">
      <div class="stat-label">待复习</div>
      <div class="stat-value is-primary" id="stat-due">0 <small>题</small></div>
    </div>
    <div class="stat">
      <div class="stat-label">题库总数</div>
      <div class="stat-value" id="stat-total">0 <small>题</small></div>
    </div>
    <div class="stat">
      <div class="stat-label">已掌握</div>
      <div class="stat-value is-success" id="stat-master">0 <small>题</small></div>
    </div>
    <div class="stat">
      <div class="stat-label">累计正确率</div>
      <div class="stat-value" id="stat-acc">—</div>
    </div>
  </section>

  <!-- 开始复习 -->
  <section class="card mt-24">
    <div class="card-pad">
      <div class="gap-row" style="justify-content: space-between; align-items: center;">
        <div>
          <h2 style="font-size:18px; margin-bottom: 4px;">开始今天的练习</h2>
          <p class="text-muted text-sm" id="due-hint">正在读取学习进度…</p>
        </div>
      </div>

      <div class="gap-row mt-16">
        <a class="btn btn-lg" id="btn-due" href="quiz.html?mode=due">开始今日复习</a>
        <a class="btn btn-ghost btn-lg" href="quiz.html?mode=random&count=10">随机 10 题</a>
        <a class="btn btn-ghost btn-lg" href="quiz.html?mode=all">全部题目</a>
      </div>

      <div class="notice mt-16">
        <span>💡</span>
        <span>连续答对 <strong>3 次</strong> 的题目会被标记为「已掌握」，复习间隔按 <strong>1 / 3 / 7 / 15 / 30 天</strong> 逐步拉长；答错的题会立刻回到今天的队列。</span>
      </div>
    </div>
  </section>

  <!-- 按系统练习 -->
  <section class="card mt-24">
    <div class="card-head">
      <h2>按系统练习</h2>
      <span class="sub">点任意系统，单独刷这一章的题</span>
    </div>
    <div class="card-pad">
      <div class="chapter-grid" id="chapter-grid">
        <p class="text-muted text-sm">加载中…</p>
      </div>
      <div class="gap-row mt-16">
        <a class="btn btn-ghost btn-sm" href="quiz.html?mode=random&count=20">随机 20 题</a>
        <a class="btn btn-ghost btn-sm" href="quiz.html?mode=all">全部系统混考</a>
        <a class="btn btn-ghost btn-sm" href="quiz.html?mode=wrong">只练错题</a>
      </div>
    </div>
  </section>

  <!-- 最近记录 -->
  <section class="card mt-24">
    <div class="card-head">
      <h2>最近答题</h2>
      <a class="text-sm" href="stats.html">查看全部统计 →</a>
    </div>
    <div class="q-list" id="recent-list"></div>
  </section>

</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';

  var s = App.stats();          // 统计结果
  var state = App.state();      // 原始数据（题目、记录）

  /* ---- 日期问候 ---- */
  var now = new Date();
  var h = now.getHours();
  var word = h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = word + '，今天学点什么？';

  var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][now.getDay()];
  document.getElementById('today').textContent =
    now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 ' + week;

  /* ---- 概览数字 ---- */
  document.getElementById('stat-due').innerHTML = s.due + ' <small>题</small>';
  document.getElementById('stat-total').innerHTML = s.total + ' <small>题</small>';
  document.getElementById('stat-master').innerHTML = s.mastered + ' <small>题</small>';
  document.getElementById('stat-acc').textContent = s.answered ? s.accuracy + '%' : '—';

  /* ---- 待复习提示 ---- */
  var hint = document.getElementById('due-hint');
  var btnDue = document.getElementById('btn-due');
  if (s.total === 0) {
    hint.textContent = '题库还是空的，先去「题库」页添加题目吧。';
    btnDue.textContent = '去添加题目';
    btnDue.setAttribute('href', 'bank.html');
  } else if (s.due === 0) {
    hint.textContent = '今天的复习任务已经完成，可以随机练习几题巩固一下。';
    btnDue.textContent = '随机巩固 10 题';
    btnDue.setAttribute('href', 'quiz.html?mode=random&count=10');
  } else {
    hint.textContent = '有 ' + s.due + ' 道题到了复习时间，预计 ' +
      Math.max(1, Math.round(s.due * 0.5)) + ' 分钟可以完成。';
  }

  /* ---- 按系统练习 ---- */
  var chapters = s.chapterStats;
  var grid = document.getElementById('chapter-grid');
  if (!chapters.length) {
    grid.innerHTML = '<p class="text-muted text-sm">暂无章节数据。</p>';
  } else {
    grid.innerHTML = chapters.map(function (c) {
      var pct = c.total ? Math.round((c.mastered / c.total) * 100) : 0;
      return '' +
        '<a class="chapter-card" href="quiz.html?mode=chapter&chapter=' +
          encodeURIComponent(c.chapter) + '">' +
          '<span class="cc-head">' +
            '<span class="cc-name">' + App.escapeHtml(c.chapter) + '</span>' +
            '<span class="cc-count">' + c.total + ' 题</span>' +
          '</span>' +
          '<span class="progress"><span class="progress-bar" style="width:' + pct + '%"></span></span>' +
          '<span class="cc-foot">已掌握 ' + c.mastered + ' / ' + c.total + '</span>' +
        '</a>';
    }).join('');
  }

  /* ---- 最近答题 ---- */
  var recent = state.records.slice(-6).reverse();
  var recentBox = document.getElementById('recent-list');
  if (!recent.length) {
    recentBox.innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">📖</div>' +
        '<h3>还没有答题记录</h3>' +
        '<p>开始第一次练习后，这里会显示你的答题情况</p>' +
        '<a class="btn" href="quiz.html?mode=random&count=10">随机来 10 题</a>' +
      '</div>';
  } else {
    var byId = {};
    state.questions.forEach(function (q) { byId[q.id] = q; });
    recentBox.innerHTML = recent.map(function (r) {
      var q = byId[r.qid];
      var stem = q ? q.stem : '（题目已删除）';
      var typeLabel = q ? (App.TYPES[q.type] || '') : '';
      return '' +
        '<div class="q-item">' +
          '<div class="q-item-main">' +
            '<div class="q-item-stem">' + App.escapeHtml(stem) + '</div>' +
            '<div class="q-item-meta">' +
              (typeLabel ? '<span class="tag tag-type">' + typeLabel + '</span>' : '') +
              '<span class="tag">' + App.escapeHtml(r.chapter || '') + '</span>' +
              '<span class="text-muted text-sm">' + App.formatDateTime(r.ts) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="q-item-actions">' +
            '<span class="tag ' + (r.correct ? 'tag-master' : 'tag-learning') + '">' +
              (r.correct ? '答对' : '答错') +
            '</span>' +
          '</div>' +
        '</div>';
    }).join('');
  }
})();
</script>

</body>
</html>
