<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" width="430" height="300" role="img" aria-label="眼球水平切面示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="430" height="300" fill="#ffffff"/>

  <!-- 视神经（先画，压在眼球下面） -->
  <path d="M290,150 L400,150" stroke="#fcd34d" stroke-width="20" stroke-linecap="round"/>
  <path d="M290,150 L400,150" stroke="#fef3c7" stroke-width="10" stroke-linecap="round"/>

  <!-- 眼球壁 / 巩膜 -->
  <circle cx="210" cy="150" r="104" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>

  <!-- 玻璃体 -->
  <circle cx="212" cy="150" r="94" fill="#f1f5f9"/>

  <!-- 视网膜（内层弧） -->
  <path d="M200,58 A98,98 0 0 1 200,242" fill="none" stroke="#cbd5e1" stroke-width="7"/>

  <!-- 角膜（左侧膨出） -->
  <path d="M118,86 C88,106 88,194 118,214 C104,150 104,150 118,86 Z"
        fill="#dbeafe" stroke="#475569" stroke-width="2"/>

  <!-- 虹膜 -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="1.5">
    <path d="M124,94 L142,112 L142,102 L132,92 Z"/>
    <path d="M124,206 L142,188 L142,198 L132,208 Z"/>
  </g>

  <!-- 被标注的晶状体 -->
  <ellipse cx="148" cy="150" rx="21" ry="47" fill="#fecdd3" stroke="#be123c" stroke-width="2.2"/>

  <!-- 标注 -->
  <line x1="60" y1="56" x2="130" y2="116" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="46" cy="48" r="16" fill="#be123c"/>
  <text x="46" y="54" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="215" y="288" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">眼球水平切面示意图</text>
</svg>
