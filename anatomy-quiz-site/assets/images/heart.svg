<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 330" width="420" height="330" role="img" aria-label="心脏四腔结构示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="420" height="330" fill="#ffffff"/>

  <!-- 大血管 -->
  <rect x="136" y="16" width="26" height="46" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="204" y="8" width="30" height="54" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <rect x="248" y="16" width="26" height="46" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- 心脏轮廓 -->
  <path d="M210,54 C158,54 108,92 108,148 L108,192 C108,258 158,296 210,296
           C262,296 312,258 312,192 L312,148 C312,92 262,54 210,54 Z"
        fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>

  <!-- 被标注的心腔：右心室（图中左下） -->
  <path d="M110,174 H208 V294 C186,293 160,284 142,266 C124,248 110,222 110,196 Z"
        fill="#fecdd3"/>

  <!-- 房间隔 -->
  <line x1="210" y1="56" x2="210" y2="166" stroke="#475569" stroke-width="2.5"/>
  <!-- 室间隔（较厚） -->
  <line x1="210" y1="178" x2="210" y2="294" stroke="#475569" stroke-width="6"/>
  <!-- 房室界 -->
  <line x1="110" y1="172" x2="310" y2="172" stroke="#475569" stroke-width="2.5"/>

  <!-- 心房/心室提示小字 -->
  <text x="160" y="110" font-size="13" fill="#64748b" text-anchor="middle" font-family="sans-serif">心房</text>
  <text x="260" y="110" font-size="13" fill="#64748b" text-anchor="middle" font-family="sans-serif">心房</text>

  <!-- 标注箭头 -->
  <line x1="72" y1="238" x2="104" y2="228" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="52" cy="246" r="16" fill="#be123c"/>
  <text x="52" y="252" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="210" y="322" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">心脏结构示意图</text>
</svg>
