<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-label="长骨纵切面示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="300" height="360" fill="#ffffff"/>

  <!-- 骨膜：外圈粉色带（用外描边模拟薄膜） -->
  <path d="M150,30 C104,30 74,58 74,92 L74,120 L106,120 L106,240 L74,240 L74,268
           C74,302 104,330 150,330 C196,330 226,302 226,268 L226,240 L194,240
           L194,120 L226,120 L226,92 C226,58 196,30 150,30 Z"
        fill="none" stroke="#fecdd3" stroke-width="12" stroke-linejoin="round"/>

  <!-- 骨本体 -->
  <path d="M150,30 C104,30 74,58 74,92 L74,120 L106,120 L106,240 L74,240 L74,268
           C74,302 104,330 150,330 C196,330 226,302 226,268 L226,240 L194,240
           L194,120 L226,120 L226,92 C226,58 196,30 150,30 Z"
        fill="#f8fafc" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 骨密质内环 -->
  <path d="M150,48 C112,48 92,70 92,94 L92,112 L118,112 L118,248 L92,248 L92,266
           C92,290 112,312 150,312 C188,312 208,290 208,266 L208,248 L182,248
           L182,112 L208,112 L208,94 C208,70 188,48 150,48 Z"
        fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 骨髓腔 -->
  <path d="M128,124 L172,124 L172,236 L128,236 Z" fill="#fde68a" stroke="#d6b25a" stroke-width="1.5"/>
  <rect x="132" y="60" width="36" height="30" rx="8" fill="#fde68a" stroke="#d6b25a" stroke-width="1.2"/>
  <rect x="132" y="270" width="36" height="30" rx="8" fill="#fde68a" stroke="#d6b25a" stroke-width="1.2"/>

  <!-- 骺线 -->
  <line x1="96" y1="118" x2="204" y2="118" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="96" y1="242" x2="204" y2="242" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 标注（指向骨膜外圈） -->
  <line x1="258" y1="70" x2="222" y2="86" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="272" cy="62" r="16" fill="#be123c"/>
  <text x="272" y="68" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="150" y="352" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">长骨纵切面示意图</text>
</svg>
