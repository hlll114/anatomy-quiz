<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="肺泡与毛细血管气体交换示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="420" height="300" fill="#ffffff"/>

  <!-- 细支气管（接入被标注的肺泡） -->
  <path d="M12,116 L108,112" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round"/>
  <path d="M12,116 L108,112" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>

  <!-- 肺泡之间的连接管（先画，压在肺泡下面） -->
  <g stroke="#cbd5e1" stroke-width="9" stroke-linecap="round">
    <line x1="196" y1="126" x2="222" y2="104"/>
    <line x1="214" y1="150" x2="240" y2="160"/>
    <line x1="182" y1="152" x2="172" y2="178"/>
    <line x1="248" y1="198" x2="216" y2="210"/>
  </g>

  <!-- 被标注的肺泡 -->
  <circle cx="152" cy="112" r="46" fill="#fecdd3" stroke="#be123c" stroke-width="2.2"/>

  <!-- 其他肺泡 -->
  <g fill="#f1f5f9" stroke="#475569" stroke-width="2">
    <circle cx="258" cy="86" r="38"/>
    <circle cx="272" cy="170" r="40"/>
    <circle cx="182" cy="212" r="36"/>
  </g>

  <!-- 毛细血管 -->
  <path d="M40,268 C110,268 140,244 190,250 C246,256 280,268 380,262"
        fill="none" stroke="#fca5a5" stroke-width="14" stroke-linecap="round"/>
  <path d="M40,268 C110,268 140,244 190,250 C246,256 280,268 380,262"
        fill="none" stroke="#fee2e2" stroke-width="7" stroke-linecap="round"/>

  <!-- 气体交换箭头 -->
  <line x1="152" y1="162" x2="158" y2="236" stroke="#0284c7" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="166" y="196" font-size="12" fill="#0284c7" font-family="sans-serif">O₂</text>
  <line x1="212" y1="238" x2="200" y2="196" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="216" y="222" font-size="12" fill="#be123c" font-family="sans-serif">CO₂</text>

  <!-- 标注 -->
  <line x1="72" y1="42" x2="116" y2="78" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="56" cy="32" r="16" fill="#be123c"/>
  <text x="56" y="38" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="210" y="294" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">肺泡与毛细血管示意图</text>
</svg>
