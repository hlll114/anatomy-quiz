<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" role="img" aria-label="消化道结构示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="400" height="340" fill="#ffffff"/>

  <!-- 食管 -->
  <rect x="176" y="10" width="22" height="66" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- 肝脏 -->
  <path d="M84,88 L170,82 L170,132 L88,138 Z" fill="#fde68a" stroke="#475569" stroke-width="2"/>
  <text x="127" y="116" font-size="12" fill="#78716c" text-anchor="middle" font-family="sans-serif">肝</text>

  <!-- 胃 -->
  <path d="M180,78 C204,78 220,96 220,120 C220,148 200,168 176,168
           C156,168 142,154 142,136 C142,122 152,112 152,100
           C152,88 164,78 180,78 Z"
        fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>

  <!-- 大肠（框） -->
  <path d="M96,196 L304,196 M96,196 L96,290 M304,196 L304,290 M96,290 L304,290"
        fill="none" stroke="#cbd5e1" stroke-width="13" stroke-linecap="round"/>

  <!-- 被标注的小肠（盘曲） -->
  <path d="M176,178 C176,206 128,206 128,228 C128,250 200,250 200,228
           C200,206 268,206 268,228 C268,250 196,272 160,268"
        fill="none" stroke="#fecdd3" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M176,178 C176,206 128,206 128,228 C128,250 200,250 200,228
           C200,206 268,206 268,228 C268,250 196,272 160,268"
        fill="none" stroke="#fff1f2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 标注 -->
  <line x1="336" y1="230" x2="282" y2="228" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="352" cy="230" r="16" fill="#be123c"/>
  <text x="352" y="236" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="200" y="330" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">消化道结构示意图</text>
</svg>
