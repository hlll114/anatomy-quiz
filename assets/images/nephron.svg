<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" width="440" height="310" role="img" aria-label="肾单位结构示意图">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#be123c"/>
    </marker>
  </defs>
  <rect width="440" height="310" fill="#ffffff"/>

  <!-- 入球/出球小动脉 -->
  <line x1="30" y1="88" x2="78" y2="88" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
  <line x1="30" y1="112" x2="78" y2="112" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <text x="26" y="76" font-size="11" fill="#94a3b8" font-family="sans-serif">入球</text>
  <text x="26" y="136" font-size="11" fill="#94a3b8" font-family="sans-serif">出球</text>

  <!-- 肾小囊（杯状） -->
  <path d="M118,52 C72,52 44,74 44,100 C44,126 72,148 118,148"
        fill="#eff6ff" stroke="#475569" stroke-width="2.5"/>

  <!-- 被标注的肾小球（毛细血管球） -->
  <g fill="#fecdd3" stroke="#be123c" stroke-width="1.6">
    <circle cx="96" cy="82" r="15"/>
    <circle cx="118" cy="98" r="14"/>
    <circle cx="94" cy="116" r="14"/>
    <circle cx="118" cy="126" r="11"/>
    <circle cx="76" cy="98" r="12"/>
  </g>

  <!-- 肾小管（管腔效果：外壁 + 内腔） -->
  <path d="M132,100 C176,94 196,120 190,152 C184,186 138,194 138,226
           C138,256 168,266 188,248 C208,230 228,208 262,212 L300,212 L300,272"
        fill="none" stroke="#cbd5e1" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132,100 C176,94 196,120 190,152 C184,186 138,194 138,226
           C138,256 168,266 188,248 C208,230 228,208 262,212 L300,212 L300,272"
        fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 集合管 -->
  <text x="316" y="150" font-size="12" fill="#64748b" font-family="sans-serif">→ 集合管</text>

  <!-- 标注 -->
  <line x1="150" y1="176" x2="122" y2="130" stroke="#be123c" stroke-width="2.5" marker-end="url(#ar)"/>
  <circle cx="160" cy="192" r="16" fill="#be123c"/>
  <text x="160" y="198" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle" font-family="sans-serif">?</text>

  <text x="220" y="300" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-family="sans-serif">肾单位结构示意图</text>
</svg>
